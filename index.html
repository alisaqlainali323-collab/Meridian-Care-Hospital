/* ── PROFESSIONAL NAVBAR ─────────────────────────────────── */
.site-header{
  position:sticky;top:0;z-index:100;
  width:100%;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(215,236,231,.8);
  box-shadow:0 1px 20px rgba(6,40,35,.06);
}
.site-header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0;
  width:100%;
  max-width:none;
  /* Match hero left-col padding exactly: hero-v2-left uses padding-left:48px on ≥900px, 72px on ≥1100px */
  padding:0 72px;
  height:70px;
  box-sizing:border-box;
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  flex-shrink:0;text-decoration:none;
}
.brand-mark{
  display:grid;place-items:center;
  width:36px;height:36px;border-radius:10px;
  background:var(--primary);
  color:#fff;font-size:16px;font-weight:800;line-height:1;flex-shrink:0;
}
.brand strong{
  display:block;font-size:14.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:#2f7d3f;
}
.brand small{
  display:block;margin-top:1px;color:var(--muted);
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
/* Nav links — right side */
.site-nav{
  display:none;
  align-items:center;
  gap:2px;
  margin:0;padding:0;list-style:none;
  margin-left:auto;
}
.site-nav a{
  display:inline-block;
  padding:7px 16px;
  border-radius:7px;
  color:#3d6a5f;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  transition:background .14s,color .14s;
  white-space:nowrap;position:relative;
}
.site-nav a:hover{
  background:rgba(47,125,63,.07);color:var(--primary);
}
.site-nav a.is-active{
  color:var(--primary);
}
.site-nav a.is-active::after{
  content:'';
  position:absolute;bottom:-2px;left:12px;right:12px;
  height:2px;border-radius:999px;
  background:var(--primary);
}
/* CTA button */
.nav-cta-wrap{
  display:none;
  align-items:center;gap:0;
  margin-left:5px;flex-shrink:0;
}
.nav-divider{
  width:1px;height:20px;background:var(--line);
  margin-right:20px;flex-shrink:0;
}
.header-cta{
  display:inline-flex;
  align-items:center;gap:7px;
  padding:9px 18px;
  border-radius:9px;
  background:var(--primary);
  color:#fff;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:700;
  border:none;cursor:pointer;
  box-shadow:0 4px 14px rgba(47,125,63,.24);
  transition:background .15s,transform .14s,box-shadow .14s;
  text-decoration:none;white-space:nowrap;
}
.header-cta:hover{
  background:var(--primaryDark);transform:translateY(-1px);
  box-shadow:0 8px 22px rgba(47,125,63,.32);
}
.header-cta svg{
  width:14px;height:14px;stroke:#fff;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
}
/* Hamburger */
.nav-toggle{
  display:inline-grid;place-items:center;
  width:38px;height:38px;
  border:1px solid var(--line);border-radius:8px;
  color:var(--primary);background:var(--white);cursor:pointer;
  flex-shrink:0;
}
/* Desktop: show nav + CTA, hide hamburger */
@media(min-width:980px){
  .site-nav{display:flex;}
  .nav-cta-wrap{display:flex;}
  .nav-toggle{display:none;}
}
/* Tablet/mobile */
@media(max-width:979px){
  .site-header-inner{padding:0 20px;height:60px;}
  .site-nav{
    display:none;
    position:absolute;top:60px;left:0;right:0;
    flex-direction:column;align-items:stretch;
    background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 24px rgba(6,40,35,.09);
    padding:8px 16px 16px;z-index:99;margin-left:0;
  }
  .site-nav.is-open{display:flex;}
  .site-nav a{padding:12px 12px;border-radius:8px;font-size:15px;}
  .site-nav a.is-active::after{display:none;}
  .nav-cta-wrap{display:none;}
}
/* Call Now button */
.nav-actions{
  display:flex;align-items:center;gap:12px;
  margin-left:16px;flex-shrink:0;
}
.nav-call-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 10px;
  border-radius:8px;
  background:var(--primary);
  color:#fff;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:700;
  border:none;cursor:pointer;white-space:nowrap;
  box-shadow:0 4px 14px rgba(47,125,63,.24);
  transition:background .15s,transform .14s,box-shadow .14s;
}
.nav-call-btn:hover{
  background:var(--primaryDark);transform:translateY(-1px);
  box-shadow:0 8px 22px rgba(47,125,63,.32);
}
.nav-call-btn-icon{ display:inline-flex;width:15px;height:15px;flex-shrink:0; }
.nav-call-btn-icon svg{ width:100%;height:100%;fill:#fff; }
/* When JS relocates the button inside the mobile dropdown menu */
.site-nav .nav-call-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  margin:10px 12px 4px;
  padding:13px 18px;
  color:#fff;
}
.site-nav .nav-call-btn:hover{
  background:var(--primaryDark);
  color:#fff;
}
/* ── END NAVBAR ──────────────────────────────────────────── */

/* ── ABOUT SECTION MOBILE ─────────────────────────────────── */
/* On mobile: eyebrow + heading first, then image, then text + stats */
@media(max-width:979px){
  .section.about{
    display:flex !important;
    flex-direction:column !important;
    gap:0 !important;
  }
  /* Text column: split into header part and body part */
  .section.about .section-copy{
    display:contents; /* unwrap so children can be individually ordered */
  }
  .section.about .section-copy .eyebrow{ order:1; margin-bottom:8px; }
  .section.about .section-copy h2{      order:2; margin-bottom:0; }
  .section.about .about-media{          order:3; margin:20px 0; }
  .section.about .section-copy p{       order:4; }
  .section.about .section-copy .check-list{ order:5; }

  /* Stats panel: force 3-col horizontal row */
  .stats-panel{
    grid-template-columns:repeat(3,1fr) !important;
    gap:0 !important;
  }
  .stats-panel li{
    border-right:1px solid var(--line) !important;
    border-bottom:0 !important;
    padding-bottom:0 !important;
  }
  .stats-panel li:last-child{ border-right:0 !important; }
}
@media(max-width:480px){
  .stats-panel{ padding:10px 8px !important; }
  .stats-panel strong{ font-size:20px !important; }
  .stats-panel span:last-child{ font-size:11px !important; }
  .stats-panel li{ padding:0 4px !important; }
}
/* ── END ABOUT MOBILE ─────────────────────────────────────── */
/* All sections share the hero's horizontal padding */
.section{
  padding-left:72px !important;
  padding-right:72px !important;
  max-width:none;
  box-sizing:border-box;
}
@media(max-width:979px){
  .section{padding-left:20px !important;padding-right:20px !important;}
}

/* About image — fixed height, no overflow */
.about-image{
  display:block;
  width:100%;
  height:470px !important;
  min-height:unset !important;
  max-height:unset !important;
  object-fit:cover;
  border-radius:16px;
  overflow:hidden;
}
div.about-image{
  height:470px !important;
}
/* Stats panel — sits cleanly below image, no negative margin */
.stats-panel{
  position:static !important;
  margin:18px 0 0 !important;
  width:100% !important;
  border-radius:14px !important;
  border:1px solid var(--line) !important;
  box-shadow:0 8px 28px rgba(6,40,35,.08) !important;
}
@media(max-width:700px){
  .about-image,div.about-image{height:260px !important;}
  /* stats panel stays 3-col — overridden above in the about-mobile block */
}
/* ── ABOUT SECTION DESKTOP: image left, content right ─────── */
@media (min-width:980px){
  .section.about{grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr);}
  .section.about .section-copy{order:2;}
  .section.about .about-media{order:1;}
}
/* ── END SECTION + ABOUT ALIGNMENT ──────────────────────── */

/* ── REDESIGNED HERO v3 — Mobile-First Gradient Fade ──────── */
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap');

/* ════════════════════════════════════════════
   BASE HERO — shared across breakpoints
════════════════════════════════════════════ */
.hero-v2{
  position:relative;
  width:100%;
  overflow:hidden;
  display:flex;
  align-items:flex-end; /* content anchors to bottom on mobile */
}

/* Picture / image fills the entire hero */
.hero-v2 picture{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}
.hero-v2-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
  z-index:0;
}

/* Placeholder when no image */
.hero-v2-placeholder{
  position:absolute;
  inset:0;
  z-index:0;
  background:linear-gradient(145deg,#0a4038 0%,#0f6657 45%,#159a86 100%);
  display:flex;align-items:center;justify-content:center;
}
.hero-v2-placeholder-inner{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  opacity:.35;color:#fff;
}
.hero-v2-placeholder-inner svg{ width:90px;height:90px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round; }
.hero-v2-placeholder-inner span{ font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#fff; }

/* Hide unused elements */
.hero-v2-right,.hero-v2-card,.hero-v2-badge,.hero-v2-blob1,.hero-v2-blob2,.hero-v2-curve,.hero-v2-img-overlay{ display:none; }

/* ════════════════════════════════════════════
   MOBILE HERO (≤768px) — Primary design
   Full-viewport, gradient fade from bottom
════════════════════════════════════════════ */
.hero-v2{
  min-height:90svh;
}

/* The gradient overlay — white at bottom fading to transparent at ~57% */
.hero-v2::after{
  content:'';
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(
    to top,
    rgba(255,255,255,0.97) 0%,
    rgba(255,255,255,0.92) 20%,
    rgba(255,255,255,0.70) 60%,
    rgba(255,255,255,0.20) 65%,
    rgba(255,255,255,0)    85%
  );
  pointer-events:none;
}

/* Content — sits in bottom 40%, above gradient */
.hero-v2-left{
  position:relative;
  z-index:2;
  width:100%;
  max-width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0 24px 60px;
}

/* Eyebrow */
.hero-v2-eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 16px;
  color:#2f7d3f;
}
.hero-v2-eyebrow-line{
  display:block;
  width:40px;
  height:1px;
  background:#2f7d3f;
  flex-shrink:0;
}
.hero-v2-eyebrow-text{
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:#2f7d3f;
  white-space:nowrap;
}

/* Headline */
.hero-v2-h1{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(32px,8vw,55px);
  line-height:1.08;
  color:#12211a;
  margin:0 0 14px;
  font-weight:400;
}
.hero-v2-h1 em{
  font-style:italic;
  color:#2f7d3f;
}

/* Subtext */
.hero-v2-sub{
  font-family:Inter,Arial,sans-serif;
  font-size:16px;
  line-height:1.65;
  color:#3a4d47;
  max-width:100%;
  margin:0 0 24px;
}

/* CTA row */
.hero-v2-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

/* Primary CTA */
.hero-v2-btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 10px;
  border-radius:10px;
  background:var(--primary,#2f7d3f);
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  border:none;cursor:pointer;
  box-shadow:0 6px 22px rgba(47,125,63,.30);
  transition:transform .18s ease,box-shadow .18s ease,background .18s;
  text-decoration:none;
  flex:1;
  justify-content:center;
  min-width:0;
}
.hero-v2-btn-primary:hover{
  background:var(--primaryDark,#235c2f);
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(47,125,63,.38);
}
.hero-v2-btn-primary svg{
  width:15px;height:15px;stroke:#fff;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
}

/* Secondary CTA */
.hero-v2-btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 10px;
  border-radius:10px;
  background:rgba(47,125,63,.08);
  border:1.5px solid #2f7d3f;
  color:#2f7d3f;
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .18s ease;
  text-decoration:none;
  flex:0 0 auto;
  justify-content:center;
  white-space:nowrap;
}
.hero-v2-btn-ghost:hover{
  transform:translateY(-1px);
}
.hero-v2-btn-ghost svg{
  width:16px;height:16px;flex-shrink:0;
}

/* Buttons always sit side-by-side; primary grows, ghost stays content-width */

/* Fade-in animations */
/* .hero-v2-eyebrow animation removed — eyebrow element no longer rendered */
.hero-v2-h1     { animation:heroFadeUp .5s .13s both cubic-bezier(.22,.68,0,1.2); }
.hero-v2-sub    { animation:heroFadeUp .5s .20s both cubic-bezier(.22,.68,0,1.2); }
.hero-v2-actions{ animation:heroFadeUp .5s .27s both cubic-bezier(.22,.68,0,1.2); }
@keyframes heroFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════════════════════════════════
   TABLET (769px–899px) — slightly wider padding
════════════════════════════════════════════ */
@media(min-width:769px) and (max-width:899px){
  .hero-v2-left{ padding:0 32px 48px; }
  .hero-v2-h1{ font-size:clamp(36px,6vw,48px); }
}

/* ════════════════════════════════════════════
   DESKTOP (≥1181px) — side-by-side layout
════════════════════════════════════════════ */
@media(min-width:1181px){
  .hero-v2{
    min-height:calc(100vh - 70px);
    align-items:center; /* vertically center on desktop */
  }
  /* On desktop, gradient covers left half so text is legible */
  .hero-v2::after{
    background:linear-gradient(
      to right,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.90) 25%,
      rgba(255,255,255,0.55) 40%,
      rgba(255,255,255,0)    55%
    );
  }
  .hero-v2-left{
    max-width:min(780px, 56%);
    padding:90px 48px 90px 72px;
    justify-content:center;
  }
  .hero-v2-sub{ max-width:500px; }
  .hero-v2-btn-primary,
  .hero-v2-btn-ghost{
    flex:0 0 auto;
    min-width:0;
  }
}
@media(min-width:1181px){
  .hero-v2-left{ padding:90px 56px 90px 72px; }
}

/* ── Tablet (769px–1180px) — dedicated tab image, content anchored bottom ── */
@media(min-width:769px) and (max-width:1180px){
  /* Tab image is purpose-built so no horizontal shifting needed */
  .hero-v2-bg{
    object-position:center top;
  }
  /* Content sits at the bottom like mobile — tall portrait viewport has room */
  .hero-v2{
    align-items:flex-end;
  }
  /* Gradient fades bottom-up like mobile, not left-right */
  .hero-v2::after{
    background:linear-gradient(
      to top,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.90) 22%,
      rgba(255,255,255,0.55) 42%,
      rgba(255,255,255,0.10) 60%,
      rgba(255,255,255,0)    75%
    );
  }
  /* Text sits full-width at the bottom with generous side padding */
  .hero-v2-left{
    max-width:700px;
    width:100%;
    padding:0 48px 68px;
  }
  .hero-v2-h1{
    font-size:clamp(36px,5vw,52px);
  }
  .hero-v2-sub{
    max-width:520px;
  }
}

══════════════════════════════════════════════════════════ */

/* Hide old separate progress wrap — stepper is now inside the shell */
.wiz-progress-wrap{ display: none !important; }

/* Wizard shell — card style matching reference image */
.wiz-shell{
  max-width: 700px;
  margin: 0 auto 80px;
  padding: 32px 32px 36px;
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(6,40,35,.08);
}
@media(max-width:600px){
  .wiz-shell{ padding: 24px 20px 28px; margin-left: 16px; margin-right: 16px; }
}

/* ── Inline stepper inside shell ── */
.wiz-stepper-inline{
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 28px;
}
.wiz-stepper-inline__step{
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.wiz-stepper-inline__dot{
  width: 32px; height: 32px;
  border-radius: 999px;
  background: #e0f0ea;
  border: 2px solid #c6e6da;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  color: var(--muted);
  transition: background .3s, border-color .3s, color .3s;
  flex-shrink: 0;
}
.wiz-stepper-inline__step--active .wiz-stepper-inline__dot{
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.wiz-stepper-inline__step--done .wiz-stepper-inline__dot{
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.wiz-stepper-inline__label{
  font-size: 13.5px; font-weight: 600;
  color: var(--muted);
  transition: color .3s;
  white-space: nowrap;
}
.wiz-stepper-inline__step--active .wiz-stepper-inline__label,
.wiz-stepper-inline__step--done .wiz-stepper-inline__label{
  color: var(--ink);
}
.wiz-stepper-inline__line{
  flex: 1;
  height: 2px;
  background: #d7ecd9;
  border-radius: 999px;
  margin: 0 10px;
  min-width: 24px;
}
.wiz-stepper-inline__line--done{
  background: var(--primary);
}
.wiz-pane{ animation: wizIn .28s ease; }
.wiz-pane--hidden{ display: none !important; }
@keyframes wizIn{
  from{ opacity:0; transform:translateY(12px); }
  to{   opacity:1; transform:translateY(0); }
}

/* Pane header */
.wiz-pane-head{ margin-bottom: 24px; }
.wiz-pane-num{
  display: none; /* step number now shown in inline stepper */
}
.wiz-pane-title{
  font-size: clamp(20px,4vw,28px);
  font-weight: 800;
  color: var(--ink);
  margin: 0 0 6px;
  font-family: 'DM Sans', sans-serif;
}
.wiz-pane-sub{
  color: var(--muted);
  font-size: 14.5px;
  margin: 0;
}

/* Service / Reason chip grid — 3 columns pill style (matches reference image) */
.svc-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
@media(max-width:480px){
  .svc-grid{ grid-template-columns: repeat(2, 1fr); }
}
.svc-card{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 10px;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  background: #f9fbfa;
  cursor: pointer;
  transition: border-color .18s, box-shadow .18s, background .18s;
  text-align: center;
  min-height: 56px;
}
.svc-card:hover{
  border-color: rgba(47,125,63,.3);
  box-shadow: 0 4px 16px rgba(47,125,63,.07);
  background: #f4f9f7;
}
.svc-card input{ position:absolute; opacity:0; pointer-events:none; }
.svc-card__radio{ display: none; }
.svc-card__label{
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
}
.svc-card__check{ display:none; }
.svc-card:has(input:checked){
  border-color: var(--primary);
  background: rgba(47,125,63,.06);
  box-shadow: 0 4px 18px rgba(47,125,63,.13);
}
.svc-card:has(input:checked) .svc-card__label{
  color: var(--primary);
  font-weight: 700;
}

/* Date & time step */
.dt-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
  margin-bottom: 36px;
}
@media(min-width:600px){ .dt-grid{ grid-template-columns: 1fr 1.4fr; } }
.dt-label{
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 14px;
}
.dt-date-input{
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.dt-date-input:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(47,125,63,.10);
}
.time-pill-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.time-pill{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 11px 6px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  transition: border-color .18s, background .18s, color .18s;
}
.time-pill input{ position:absolute; opacity:0; pointer-events:none; }
.time-pill:hover{ border-color: rgba(47,125,63,.35); }
.time-pill:has(input:checked){
  background: #2f7d3f9c;
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(47,125,63,.22);
}

/* Patient details step */
.wiz-form-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-bottom: 24px;
}
@media(max-width:540px){ .wiz-form-grid{ grid-template-columns: 1fr; } }
.wiz-label-field{
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: #334155;
  letter-spacing: .03em;
}
.wiz-label-field .field-label{
  display: flex;
  align-items: center;
  gap: 5px;
  line-height: 1;
}
.wiz-label-field input,
.wiz-label-field textarea{
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 13px 14px 13px 42px;
  font-size: 15px;
  font-weight: 400;
  color: var(--ink);
  background: #f7faf9;
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
  width: 100%;
  font-family: inherit;
}
.wiz-label-field textarea{ resize:vertical; padding-left: 42px; }
.wiz-label-field input:focus,
.wiz-label-field textarea:focus{
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(47,125,63,.10);
}
.wiz-full{ grid-column: 1 / -1; }
.req{ color: var(--primary); }
.opt{ font-weight:400; color:var(--muted); font-size:11px; }

/* Booking summary */
.wiz-summary{
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 20px 22px;
  margin-bottom: 28px;
  display: none;
  gap: 10px;
  flex-direction: column;
}
.wiz-summary.is-visible{ display:flex; }
.wiz-summary-row{
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--ink);
}
.wiz-summary-row strong{ font-weight:700; min-width:80px; color:var(--muted); }

/* Actions row — Back left, Continue right, side by side */
.wiz-actions{
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 16px;
}
.wiz-actions .btn-primary{
  flex: 1;
  justify-content: center;
  border-radius: 12px;
  padding: 15px 24px;
  font-size: 15px;
  background: var(--primary);
  box-shadow: 0 6px 20px rgba(47,125,63,.22);
  letter-spacing: .02em;
  color: #fff;
  border: none;
  transition: box-shadow .18s ease;
}
.wiz-actions .btn-primary:hover{
  background: var(--primary);
  transform: none;
  box-shadow: 0 8px 28px rgba(47,125,63,.32);
}
.wiz-actions .btn-outline{
  flex: 0 0 auto;
  background: #fff;
  border: 1.5px solid var(--line);
  color: var(--muted);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  padding: 15px 20px;
  min-height: 52px;
  box-shadow: none;
  transition: border-color .18s, color .18s;
}
.wiz-actions .btn-outline:hover{
  border-color: #a9c9ac;
  color: var(--ink);
  transform: none;
  box-shadow: none;
}
.wiz-actions .btn-ghost{
  flex: 0 0 auto;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  padding: 0;
  min-height: auto;
  box-shadow: none;
}
.wiz-actions .btn-ghost:hover{
  color: var(--ink);
  transform: none;
}
/* Step 1: Back Home ghost on left, Continue on right — same side-by-side as other steps */
#wizPane1 .wiz-actions{
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}
#wizPane1 .wiz-actions .btn-primary{
  order: 2;
  flex: 1;
}
#wizPane1 .wiz-actions .btn-ghost{
  order: 1;
  flex: 0 0 auto;
  background: #fff;
  border: 1.5px solid var(--line);
  color: var(--muted);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  padding: 15px 20px;
  min-height: 52px;
  box-shadow: none;
  transition: border-color .18s, color .18s;
}
#wizPane1 .wiz-actions .btn-ghost:hover{
  border-color: #a9c9ac;
  color: var(--ink);
  transform: none;
  box-shadow: none;
}

/* Success screen */
.wiz-success{
  text-align: center;
  padding: 64px 24px;
}
.wiz-success-icon{
  width: 72px; height: 72px;
  border-radius: 999px;
  background: rgba(47,125,63,.1);
  color: var(--primary);
  display: flex; align-items:center; justify-content:center;
  margin: 0 auto 28px;
}
.wiz-success-icon svg{ width:36px;height:36px; }
.wiz-success h2{ font-size:32px; margin-bottom:14px; }
.wiz-success p{ color:var(--muted); font-size:16px; max-width:460px; margin:0 auto 36px; }
/* ── Wizard buttons: always side-by-side, override global mobile .btn{width:100%} ── */
@media(max-width:520px){
  .wiz-actions .btn{ width: auto !important; min-width: 0; }
  .wiz-actions .btn-primary{ flex: 1 !important; }
  .wiz-actions .btn-outline{ flex: 0 0 auto !important; }
  .wiz-actions .btn-ghost{ flex: 0 0 auto !important; }
}

/* ── CONTACT FULL-WIDTH MAP ──────────────────────────────── */
.contact-section{
  display:block !important;
  padding:80px 72px !important;
}
@media(max-width:979px){
  .contact-section{padding:60px 20px !important;}
}
.contact-top-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:48px;
  margin-bottom:48px;
  align-items:start;
}
@media(min-width:980px){
  .contact-top-grid{
    grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);
    gap:72px;
  }
}
.contact-map-full{
  width:100%;
  min-height:550px;
}
.contact-map-full .map-placeholder{
  min-height:320px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
@media(min-width:980px){
  .contact-map-placeholder{
    min-height:560px !important;
  }
}

/* ── BOOKING PAGE SMALL SCREEN FIXES ─────────────────────── */
@media(max-width:420px){
  .booking-hero{
    padding-left:16px !important;
    padding-right:16px !important;
  }
  .wiz-shell{
    margin-left:12px;
    margin-right:12px;
    padding:20px 16px 24px;
    border-radius:18px;
  }
  .svc-grid{
    grid-template-columns:1fr 1fr !important;
    gap:10px;
  }
  .wiz-form-grid{
    grid-template-columns:1fr !important;
  }
  .dt-grid{
    grid-template-columns:1fr !important;
  }
  .time-pill-grid{
    grid-template-columns:repeat(3,1fr);
  }
  .wiz-pane-title{
    font-size:20px;
  }
  .wiz-stepper-inline__label{
    font-size:11px;
  }
}
/* ── END BOOKING SMALL SCREEN ─────────────────────────────── */
/* Date slider */
.date-slider-wrap{
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0;
}
.date-slider-arrow{
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: #fff;
  color: var(--muted);
  cursor: pointer;
  transition: border-color .18s, color .18s, box-shadow .18s;
  font-size: 0;
}
.date-slider-arrow:hover{
  border-color: var(--primary);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(47,125,63,.12);
}
.date-slider-arrow svg{
  width: 16px; height: 16px;
  stroke: currentColor; fill: none;
  stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
}
.date-slider-track{
  flex: 1;
  overflow: hidden;
}
.date-btn-row{
  display: flex;
  gap: 8px;
  transition: transform .3s ease;
  will-change: transform;
}
.date-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:10px 0;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:#fff;
  cursor:pointer;
  transition:border-color .18s,background .18s,color .18s,box-shadow .18s;
  min-width:64px;
  width:64px;
  flex-shrink:0;
  font-family:inherit;
}
.date-btn:hover{
  border-color:rgba(47,125,63,.35);
  box-shadow:0 4px 12px rgba(47,125,63,.08);
}
.date-btn.is-active{
  border-color:var(--primary);
  background:var(--primary);
  color:#fff;
  box-shadow:0 4px 14px rgba(47,125,63,.22);
}
.date-btn__label{
  font-size:11px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.75;
}
.date-btn.is-active .date-btn__label{ opacity:.85; }
.date-btn__num{
  font-size:20px;
  font-weight:800;
  line-height:1;
}
.date-btn__day{
  font-size:11px;
  font-weight:600;
  opacity:.7;
  margin-top:1px;
}
/* Tomorrow label is longer — give it extra room */
.date-btn[data-tomorrow]{
  padding-left: 10px;
  padding-right: 10px;
  min-width: 80px;
  width: 80px;
}
@media(max-width:520px){
  .date-btn{min-width:58px;width:58px;padding:8px 0;}
  .date-btn__num{font-size:17px;}
}
/* ── MODERN CONTACT FORM ──────────────────────────────────── */
.contact-form-modern{
  display:flex;flex-direction:column;gap:18px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:20px;
  padding:32px;
  box-shadow:0 8px 32px rgba(6,40,35,.07);
}
.cfm-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.cfm-row{grid-template-columns:1fr;}}
.cfm-field{display:flex;flex-direction:column;gap:8px;}
.cfm-label{
  font-size:12.5px;font-weight:800;

}
.cfm-input-wrap{

}
.cfm-icon{

}
.cfm-icon--top{top:16px;transform:none;}
.cfm-textarea-wrap{align-items:flex-start;}
.cfm-input-wrap input,
.cfm-input-wrap textarea{

  padding:13px 14px 13px 42px;

  border-radius:12px;

}
.cfm-input-wrap textarea{resize:vertical;min-height:120px;}
.cfm-input-wrap input:focus,
.cfm-input-wrap textarea:focus{

}
.cfm-input-wrap input::placeholder,
.cfm-input-wrap textarea::placeholder{color:#bdc7d8;}
.cfm-submit{

.cfm-submit:hover{

.contact-form-modern.is-submitted .cfm-success-msg{display:flex;}
/* ── END MODERN CONTACT FORM ─────────────────────────────── */

/* ── REVIEWS MARQUEE ──────────────────────────────────────── */
.reviews-section{
  display:block;
  max-width:none;
  padding-left:0;
  padding-right:0;
}
.reviews-section .section-heading{
  max-width:var(--container);
  margin:0 auto 40px;
  padding:0 20px;
}
.reviews-marquee{
  position:relative;
  width:100%;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 60px, #000 calc(100% - 60px), transparent 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 60px, #000 calc(100% - 60px), transparent 100%);
}
.reviews-track{
  display:flex;
  gap:20px;
  width:max-content;
  animation:reviewsScroll 38s linear infinite;
}
.reviews-marquee:hover .reviews-track{ animation-play-state:paused; }
@keyframes reviewsScroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}
.reviews-track .review-card{
  flex:0 0 auto;
  width:320px;
  padding:26px 24px;
  border-radius:20px;
}
.reviews-track .review-card p{
  color:#334155;
  font-size:14.5px;

}
.reviews-track .review-card span{
  margin-top:2px;
  color:var(--muted);
  font-size:13px;
}
@media(max-width:640px){
  .reviews-track .review-card{ width:270px; }
  .reviews-track{ animation-duration:26s; }
}

  grid-template-columns:1fr;
  max-width:1100px;
  margin:0 auto;
  gap:28px;
  justify-items:center;
}

}

  gap:32px;

  box-shadow:0 14px 40px rgba(6,40,35,.07);

}
.dp-photo{

  max-width:100%;
  aspect-ratio:13/12;
  border-radius:16px;
  overflow:hidden;
  flex-shrink:0;
  background:var(--surface);

        excerpt: "Type 2 diabetes affects millions of adults, often silently for years before diagnosis. Learn the early warning signs and how it's managed.",
        image: "https://images.unsplash.com/photo-1631815588090-d4bfec5b1ccb?w=900&h=560&fit=crop&q=80",
        author: "Dr. Bilal Chaudhry",
        date: "2026-05-12",
        content: `Type 2 diabetes is one of the most common chronic health conditions worldwide, and it often develops so gradually that many people live with it for months or even years before receiving a diagnosis. Unlike Type 1 diabetes, which usually appears suddenly, Type 2 diabetes tends to creep in quietly, which is exactly why understanding the risk factors and early warning signs matters so much.

At its core, Type 2 diabetes happens when the body either becomes resistant to insulin or doesn't produce enough of it to keep blood sugar levels within a healthy range. Insulin is the hormone responsible for helping glucose move from the bloodstream into your cells, where it's used for energy. When this process breaks down, sugar builds up in the blood instead, and over time that elevated blood sugar can begin to affect multiple organ systems.

Certain factors increase the likelihood of developing Type 2 diabetes. These include being overweight or carrying excess weight around the abdomen, having a sedentary lifestyle, a family history of diabetes, being over the age of 40, and having previously been diagnosed with prediabetes or gestational diabetes. Some ethnic backgrounds also carry a higher genetic predisposition, which is one more reason regular screening is recommended rather than waiting for symptoms to appear.

Speaking of symptoms, the early signs of Type 2 diabetes can be easy to dismiss as everyday tiredness or the natural effects of aging. Increased thirst that doesn't go away, needing to urinate more frequently — especially at night — persistent fatigue even after adequate rest, blurred vision, and wounds or cuts that seem to take longer than usual to heal are all worth paying attention to. Some people also notice unexplained weight loss or recurring infections, such as skin infections or urinary tract infections, as elevated blood sugar can weaken the body's ability to fight off pathogens.

If left unmanaged over an extended period, high blood sugar doesn't just cause discomfort — it can lead to serious long-term complications. The eyes, kidneys, nerves, and cardiovascular system are particularly vulnerable. Diabetic retinopathy can affect vision, diabetic nephropathy can impair kidney function over time, and peripheral neuropathy can cause numbness, tingling, or pain, most commonly in the feet and hands. Cardiovascular disease risk also increases significantly in people with poorly controlled diabetes, which is why comprehensive management goes beyond just monitoring blood sugar numbers.

The encouraging part of this picture is that Type 2 diabetes is one of the most manageable chronic conditions when addressed early and consistently. For many patients, a combination of dietary adjustments, regular physical activity, weight management, and, where necessary, medication can bring blood sugar levels into a healthy range and significantly reduce the risk of complications. Diet plays an especially important role — focusing on whole foods, reducing refined carbohydrates and added sugars, and maintaining consistent meal timing can make a meaningful difference in blood sugar stability.

Physical activity is another cornerstone of management. Regular movement, even something as simple as a daily 30-minute walk, helps the body use insulin more effectively and supports healthy weight maintenance. Sleep quality and stress management also play a bigger role than many people realize, since both can influence hormone levels that affect blood sugar regulation.

For patients who need medication, there are now a wide range of treatment options available, and the right approach depends on individual health history, other existing conditions, and how the body responds to lifestyle changes alone. This is why working closely with a physician to build a personalized management plan tends to produce far better long-term outcomes than following generic advice.

Regular monitoring is just as important as treatment itself. Routine blood tests such as HbA1c, which reflects average blood sugar over the past two to three months, help track how well a management plan is working and allow for timely adjustments. Annual eye exams, kidney function tests, and foot checks are also recommended for anyone managing diabetes, since early detection of complications makes treatment far more effective.

If you're experiencing any of the symptoms mentioned above, have known risk factors, or simply haven't had your blood sugar checked in a while, it's worth scheduling a screening. Early detection gives you and your doctor the best chance to manage the condition proactively, protect your long-term health, and maintain a good quality of life. A short consultation today could save you from far more serious complications down the road.`

        author: "Dr. Bilal Chaudhry",
        date: "2026-04-28",
        content: `Walk into any bookstore or scroll through social media for five minutes and you'll find no shortage of weight loss advice — most of it contradictory, some of it outright unsafe, and very little of it built to last. Crash diets, extreme calorie restriction, and "detox" programs might produce quick results on the scale, but the weight almost always comes back, often accompanied by frustration and a damaged relationship with food. Sustainable weight loss looks completely different, and it's built on habits your body and lifestyle can actually maintain for years, not weeks.

The first habit worth building is prioritizing protein at every meal. Protein plays a unique role in weight management because it supports satiety, meaning it helps you feel fuller for longer and reduces the urge to snack between meals. It also helps preserve lean muscle mass during weight loss, which matters because muscle tissue burns more calories at rest than fat tissue does. Simple swaps like adding eggs, legumes, yogurt, or lean meats to meals can make a noticeable difference in how satisfied you feel throughout the day.

The second habit is shifting your definition of progress beyond the number on the scale. Body weight naturally fluctuates due to water retention, hormonal changes, and even the time of day you weigh yourself, which means the scale alone can be a misleading and demotivating measure of progress. Tracking how your clothes fit, taking periodic measurements, monitoring energy levels, and noting improvements in strength or endurance often paint a more accurate and encouraging picture of what's actually happening in your body.

Sleep is the third, and frequently underestimated, piece of the puzzle. Poor sleep doesn't just leave you tired — it directly disrupts the hormones that regulate hunger and fullness, namely ghrelin and leptin. When sleep is inconsistent or insufficient, ghrelin levels tend to rise, increasing appetite, while leptin levels drop, reducing the signal that tells your brain you're full. This hormonal imbalance can make weight management significantly harder, regardless of how disciplined your diet is. Aiming for consistent, quality sleep of seven to nine hours a night is one of the most underrated tools for supporting a healthy weight.

Fourth, the type of physical activity you choose matters more than most people assume. Forcing yourself through workouts you dread rarely leads to consistency, and consistency is what actually drives results over time. Whether it's walking, swimming, cycling, dancing, or resistance training, choosing activities you genuinely enjoy — or can at least tolerate well — makes it far more likely that movement becomes a lasting part of your routine rather than a short-lived New Year's resolution.

The fifth and perhaps most important habit is recognizing when to bring in professional support. Weight loss isn't a one-size-fits-all process, and underlying conditions like thyroid disorders, insulin resistance, polycystic ovary syndrome, or certain medications can make weight management significantly more difficult regardless of effort. A physician can help identify whether any of these factors are at play and build a plan tailored to your specific health profile, rather than relying on generic advice that may not account for your individual circumstances.

Medically supervised weight loss programs tend to outperform self-directed diets for a simple reason: they're personalized and monitored. Instead of guessing which approach might work, a physician can assess your metabolic health, review any relevant lab work, and adjust your plan based on how your body actually responds over time. This individualized approach also allows for early identification of plateaus or setbacks, so adjustments can be made before frustration sets in.

It's also worth acknowledging that sustainable weight loss is rarely a straight line. Progress often comes in phases, with periods of steady change followed by plateaus where the body adjusts to new habits. Understanding this pattern in advance can help prevent the discouragement that leads many people to abandon otherwise effective plans prematurely.

Ultimately, the habits that produce lasting results are rarely dramatic. They're small, consistent choices — prioritizing protein, respecting sleep, choosing enjoyable movement, tracking meaningful progress, and seeking guidance when needed — repeated often enough that they stop feeling like effort and simply become part of who you are. If you've struggled with weight loss in the past, a conversation with a physician can help identify what's been missing and set you on a path that actually fits your life.`

        content: `Skin is the body's largest organ, and it's also one of the most visible indicators of overall health. Because of this, it's easy to develop a habit of either over-worrying about every minor blemish or, more commonly, brushing off changes that actually deserve a closer look. The truth sits somewhere in the middle: many skin concerns genuinely do resolve on their own with basic care, but certain signs are worth a professional evaluation rather than a wait-and-see approach or a trip to the pharmacy aisle.

One of the most important things to watch for involves moles and other pigmented spots. Dermatologists often use the "ABCDE" framework to describe concerning changes: Asymmetry, where one half of a mole doesn't match the other; Border irregularity, where edges appear notched or blurred rather than smooth; Color variation within the same mole; Diameter larger than roughly the size of a pencil eraser; and Evolution, meaning any noticeable change in size, shape, color, or texture over time. If you notice a mole that fits any of these patterns, or one that has appeared suddenly in adulthood, it's worth having it evaluated promptly rather than waiting for your next routine check-up.

Acne is another area where timing matters. Occasional breakouts are extremely common and often respond well to consistent basic skincare — gentle cleansing, non-comedogenic moisturizers, and avoiding excessive scrubbing. However, if acne persists for several weeks despite a consistent routine, becomes cystic or painful, or begins leaving scarring, it's a sign that over-the-counter products may not be addressing the underlying cause. Persistent acne can be linked to hormonal factors, and a dermatologist can offer treatment options — from topical prescriptions to hormonal therapy when appropriate — that go beyond what's available without a consultation.

Hair loss is a concern that often causes significant emotional distress, and understandably so. While some hair shedding is completely normal and part of the natural growth cycle, sudden or widespread hair loss, noticeable thinning in a specific pattern, or bald patches are signs that something more specific may be happening. Causes can range from stress and nutritional deficiencies to thyroid imbalances or autoimmune conditions, and identifying the actual cause is essential for effective treatment. Guessing with over-the-counter remedies without understanding the underlying reason often wastes time and money.

Beyond addressing existing concerns, there's real value in preventive dermatology visits, particularly for people with a family history of skin conditions, significant sun exposure over the years, or fair skin that burns easily. A baseline skin check allows a dermatologist to document existing moles and spots, making it much easier to notice meaningful changes at future visits.

        title: "5 Heart Health Warning Signs You Shouldn't Ignore",
        excerpt: "Heart disease often develops silently. Here are the warning signs that mean it's time to see a cardiologist, not wait it out.",
        image: "https://images.unsplash.com/photo-1628595351029-c2bf17511435?w=900&h=560&fit=crop&q=80",
        author: "Dr. Omar Siddiqui",
        date: "2026-06-18",
        content: `Cardiovascular disease remains one of the leading health concerns worldwide, and one of the most dangerous things about it is how quietly it can develop. Unlike an injury or an infection that announces itself clearly, heart disease often progresses over years with symptoms subtle enough to dismiss as everyday tiredness, stress, or simply "getting older." Understanding the real warning signs — and taking them seriously — can make the difference between early, manageable intervention and a medical emergency.

The first and most well-known warning sign is chest discomfort or tightness, particularly when it occurs during physical activity and eases with rest. This doesn't always present as the dramatic, crushing pain often portrayed in movies. For many people, especially women, it can feel more like pressure, squeezing, fullness, or even a burning sensation that might be mistaken for indigestion. Any recurring chest discomfort, regardless of how mild, deserves medical attention rather than being brushed aside.

Shortness of breath is the second major sign to watch for, especially when it occurs with activities that didn't used to cause it — climbing a flight of stairs, walking a short distance, or even light household chores. When the heart isn't pumping efficiently, the body compensates by working harder to circulate oxygen, and breathlessness is often one of the earliest signals that something isn't functioning as it should.

Unexplained fatigue is the third warning sign, and it's frequently overlooked because tiredness has so many possible causes. However, persistent fatigue that isn't explained by poor sleep, stress, or overexertion — especially when it's a new pattern rather than a longstanding one — can indicate that the heart is struggling to meet the body's demands. This is particularly relevant for women, who are more likely to experience fatigue as a primary symptom of heart problems rather than classic chest pain.

An irregular or racing heartbeat is the fourth sign worth paying attention to. Occasional skipped beats or a brief flutter are usually harmless and common, but a heartbeat that feels consistently irregular, unusually fast even at rest, or accompanied by dizziness and lightheadedness should be evaluated. Conditions like atrial fibrillation, if left undiagnosed, can significantly increase the risk of stroke, making early detection especially important.

The fifth sign is swelling in the legs, ankles, or feet, which can indicate that the heart isn't pumping blood efficiently enough, causing fluid to accumulate in the lower extremities. This is often accompanied by a feeling of heaviness or tightness in the affected areas and can worsen throughout the day, particularly after prolonged periods of standing or sitting.

Beyond these five warning signs, it's worth understanding the risk factors that make cardiovascular screening especially important, even in the absence of symptoms. High blood pressure, high cholesterol, diabetes, smoking, obesity, a sedentary lifestyle, and a family history of heart disease all meaningfully increase risk. What makes these particularly concerning is that several of them — high blood pressure and high cholesterol especially — often have no noticeable symptoms at all, earning high blood pressure its reputation as a "silent" risk factor. This is precisely why regular screening matters even when you feel completely fine.

Preventive cardiology has come a long way, and there are now several accessible tools for assessing heart health before problems become serious. Routine blood pressure checks, lipid profile blood tests to assess cholesterol levels, and an electrocardiogram, or ECG, to evaluate the heart's electrical activity are all relatively quick, non-invasive ways to catch potential issues early. For patients with existing risk factors, stress testing may also be recommended to evaluate how the heart performs under physical exertion.

It's critical to distinguish between symptoms that warrant a scheduled consultation and those that require immediate emergency care. Sudden, severe chest pain, especially when accompanied by shortness of breath, sweating, nausea, or pain radiating to the arm, jaw, or back, are signs of a potential heart attack and require emergency care immediately — do not wait for a scheduled appointment or attempt to manage these symptoms at home.

For everything else — persistent but non-emergency symptoms, known risk factors, or simply a desire to understand your cardiovascular health better — a cardiology consultation is a proactive step worth taking. Preventive care, when started early, gives you and your doctor the best chance to identify risks, make meaningful lifestyle adjustments, and build a long-term plan that protects your heart health for years to come.`

Dermatology, on the other hand, is the right department when your concern involves the skin, hair, or nails. This includes acne that hasn't responded to basic care, rashes that persist or spread, hair loss or noticeable thinning, changes in moles or other pigmented spots, chronic conditions like eczema or psoriasis, and even cosmetic concerns like scarring or signs of aging. A dermatologist's training is specifically focused on these areas, meaning they can identify subtle patterns and offer targeted treatments that a general consultation might miss.

Cardiology becomes the right choice when your concern involves the heart or cardiovascular system more broadly. This includes chest discomfort or tightness, palpitations or an irregular heartbeat, shortness of breath during activities that didn't used to cause it, and known risk factors such as high cholesterol, high blood pressure, diabetes, or a family history of heart disease. Even without acute symptoms, a cardiology consultation can be valuable for anyone wanting a thorough assessment of their cardiovascular risk, particularly as they get older or if heart disease runs in the family.

Of course, real life doesn't always sort itself into such clean categories. Symptoms can overlap between specialties — fatigue, for instance, could stem from a thyroid issue best handled by internal medicine, a cardiovascular concern needing a cardiologist's evaluation, or even a skin condition affecting sleep quality. When you're not sure which department fits your situation, there are a few good options. Our Patient Assistant, available directly on our website, is designed specifically to help match your symptoms with the most appropriate specialist based on the details you provide. It's available anytime and can give you a starting recommendation in just a few minutes.

Alternatively, you're always welcome to simply call our front desk and describe what you're experiencing in your own words. Our staff are experienced at directing patients to the right specialist and can also help if your concern might benefit from seeing more than one doctor. There's no need to self-diagnose before reaching out — describing your symptoms as you understand them is more than enough for us to point you in the right direction.

It's also worth mentioning that choosing the "right" specialist isn't always a permanent decision. If, during your consultation, a doctor determines that your concern would be better addressed by a different specialty, they can refer you accordingly, and because all of our specialists practice within the same hospital, that transition tends to be smooth and well-coordinated. Your medical history and any test results can often be shared directly between departments, saving you from having to repeat the same information multiple times.

Ultimately, the goal of having multiple specialties under one roof is to make comprehensive care more accessible and less fragmented. Rather than navigating a maze of separate clinics and duplicated paperwork, you can receive coordinated, well-communicated care across different specialties in one place. If you're ever uncertain about where to start, don't let that uncertainty delay getting the care you need — reach out, describe what's going on, and we'll help you find the right fit.`

  function bindUi() {
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.querySelector(".site-nav");
    if (toggle && nav) {
      toggle.addEventListener("click", () => {
        nav.classList.toggle("is-open");
        toggle.setAttribute("aria-expanded", nav.classList.contains("is-open"));
      });
    }

    // Relocate the single Call Now button: inside the header on desktop,
    // inside the mobile dropdown menu (below the links) on small screens.
    const callBtn = document.getElementById("navCallBtn");
    const navActions = document.querySelector(".nav-actions");
    if (callBtn && nav && navActions) {
      const mq = window.matchMedia("(max-width:979px)");
      const placeCallBtn = () => {
        if (mq.matches) {
          if (callBtn.parentElement !== nav) nav.appendChild(callBtn);
        } else {
          if (callBtn.parentElement !== navActions) navActions.insertBefore(callBtn, toggle || null);
        }
      };
      placeCallBtn();
      mq.addEventListener ? mq.addEventListener("change", placeCallBtn) : mq.addListener(placeCallBtn);
    }

    document.querySelectorAll("form").forEach((form) => {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        form.classList.add("is-submitted");
      });
    });

    // Active nav link: scroll spy
    const navLinks = document.querySelectorAll(".site-nav a[data-section]");
    const sections = Array.from(navLinks)
      .map(a => document.getElementById(a.dataset.section))
      .filter(Boolean);

    function updateActive() {
      const scrollY = window.scrollY + 120;
      let current = null;
      for (const sec of sections) {
        const top = sec.offsetTop;
        const bottom = top + sec.offsetHeight;
        if (scrollY >= top && scrollY < bottom) { current = sec; break; }
      }
      navLinks.forEach(a => {
        a.classList.toggle("is-active", !!current && a.dataset.section === current.id);
      });
    }
    if (sections.length) {
      window.addEventListener("scroll", updateActive, { passive: true });
      updateActive();
    }

    // FAQ row accordion
    document.querySelectorAll("[data-faq]").forEach(row => {
      const btn = row.querySelector(".faq-row__trigger");
      if (!btn) return;
      btn.addEventListener("click", () => {
        const isOpen = row.classList.contains("faq-row--open");
        document.querySelectorAll("[data-faq]").forEach(r => {
          r.classList.remove("faq-row--open");
          const b = r.querySelector(".faq-row__trigger");
          if (b) b.setAttribute("aria-expanded", "false");
        });
        if (!isOpen) {
          row.classList.add("faq-row--open");
          btn.setAttribute("aria-expanded", "true");
        }
      });
    });

    // 3-Step Booking Wizard
    const panes   = [null,
      document.getElementById("wizPane1"),
      document.getElementById("wizPane2"),
      document.getElementById("wizPane3"),
      document.getElementById("wizPane4")];
    const steps   = document.querySelectorAll(".wiz-step");
    const fill    = document.getElementById("wizFill");
    const summary = document.getElementById("wizSummary");

    if (!panes[1]) return; // not on booking page

    function showPane(n) {
      panes.forEach((p, i) => { if (i > 0) p.classList.toggle("wiz-pane--hidden", i !== n); });
      // update inline stepper dots
      document.querySelectorAll(".wiz-stepper-inline__step").forEach((s, i) => {
        const stepNum = i + 1;
        s.classList.toggle("wiz-stepper-inline__step--active", stepNum === n);
        s.classList.toggle("wiz-stepper-inline__step--done", stepNum < n);
      });
      // update connector lines
      const line1 = document.getElementById("wizLine1");
      const line2 = document.getElementById("wizLine2");
      if (line1) line1.classList.toggle("wiz-stepper-inline__line--done", n > 1);
      if (line2) line2.classList.toggle("wiz-stepper-inline__line--done", n > 2);
      const wizShell = document.querySelector(".wiz-shell");
      if (wizShell) {
        const offset = wizShell.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({ top: offset, behavior: "smooth" });
      }
    }

    function buildSummary() {
      if (!summary) return;
      const svc  = document.querySelector('input[name="service"]:checked');
      const date = { value: document.getElementById("bookDate") ? document.getElementById("bookDate").value : "—" };
      const time = document.querySelector('input[name="time"]:checked');
      const rows = [
        { label:"Service", val: svc  ? svc.value  : "—" },
        { label:"Date",    val: date ? date.value  : "—" },
        { label:"Time",    val: time ? time.value  : "—" }
      ].map(r => `<div class="wiz-summary-row"><strong>${r.label}</strong><span>${r.val}</span></div>`).join("");
      summary.innerHTML = rows;
      summary.classList.add("is-visible");
    }

    // Generate date buttons as a horizontal slider
    (function() {
      const row = document.getElementById("dateBtnRow");
      const slotGrid = document.getElementById("slotGrid");
      const prevBtn = document.getElementById("dateSliderPrev");
      const nextBtn = document.getElementById("dateSliderNext");
      if (!row || !slotGrid) return;

      const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

      // Build 14 date buttons for more scroll room
      const dates = [];
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        dates.push(d);
      }

      function pad(n){ return String(n).padStart(2,'0'); }
      function formatValue(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

      // Slider offset state
      let sliderIndex = 0;
      const BTN_WIDTH = 72; // 64px btn + 8px gap

      function getVisibleCount() {
        const track = document.querySelector(".date-slider-track");
        if (!track) return 4;
        return Math.floor(track.clientWidth / BTN_WIDTH);
      }

      function updateSlider() {
        const visible = getVisibleCount();
        const maxIndex = Math.max(0, dates.length - visible);
        sliderIndex = Math.min(sliderIndex, maxIndex);
        row.style.transform = `translateX(-${sliderIndex * BTN_WIDTH}px)`;
        if (prevBtn) prevBtn.style.opacity = sliderIndex === 0 ? "0.35" : "1";
        if (nextBtn) nextBtn.style.opacity = sliderIndex >= maxIndex ? "0.35" : "1";
        if (prevBtn) prevBtn.style.pointerEvents = sliderIndex === 0 ? "none" : "auto";
        if (nextBtn) nextBtn.style.pointerEvents = sliderIndex >= maxIndex ? "none" : "auto";
      }

      if (prevBtn) prevBtn.addEventListener("click", () => { sliderIndex = Math.max(0, sliderIndex - 1); updateSlider(); });
      if (nextBtn) nextBtn.addEventListener("click", () => {
        const visible = getVisibleCount();
        sliderIndex = Math.min(dates.length - visible, sliderIndex + 1);
        updateSlider();
      });

// Generate 20-min slots from 7 PM to 10 PM (clinic hours)
const slots = [];
for (let h = 17; h < 22; h++) { // 7 PM to 10 PM
  for (let m = 0; m < 60; m += 20) { // 0, 20, 40 minutes
    const hour12 = h > 12 ? h - 12 : h;
    const ampm = h >= 12 ? 'PM' : 'AM';
    const minuteStr = m === 0 ? '00' : m.toString();
    slots.push(`${hour12}:${minuteStr} ${ampm}`);
  }
}

      function renderSlots() {
        slotGrid.innerHTML = slots.map(t => `
          <label class="time-pill">
            <input type="radio" name="time" value="${t}" />
            <span>${t}</span>
          </label>`).join("");
      }

      dates.forEach((d, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "date-btn" + (i === 0 ? " is-active" : "");
        if (i === 1) btn.setAttribute("data-tomorrow", "");
        const label = i === 0 ? "Today" : i === 1 ? "Tomorrow" : DAYS[d.getDay()];
        btn.innerHTML = `<span class="date-btn__label">${label}</span><span class="date-btn__num">${d.getDate()}</span><span class="date-btn__day">${MONTHS[d.getMonth()]}</span>`;
        btn.addEventListener("click", () => {
          row.querySelectorAll(".date-btn").forEach(b => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          document.getElementById("bookDate").value = formatValue(d);
        });
        row.appendChild(btn);
        if (i === 0) document.getElementById("bookDate").value = formatValue(d);
      });

      renderSlots();
      updateSlider();
    })();

    showPane(1);

    const n1 = document.getElementById("wizNext1");
    const n2 = document.getElementById("wizNext2");
    const b2 = document.getElementById("wizBack2");
    const b3 = document.getElementById("wizBack3");
    const sub = document.getElementById("wizSubmit");

    if (n1) n1.addEventListener("click", () => showPane(2));
    if (b2) b2.addEventListener("click", () => showPane(1));
    if (n2) n2.addEventListener("click", () => {
      // Validate: a time slot must be selected
      const selectedTime = document.querySelector('input[name="time"]:checked');
      if (!selectedTime) {
        const slotGrid = document.getElementById("slotGrid");
        if (slotGrid) {
          slotGrid.style.outline = "2px solid #e53e3e";
          slotGrid.style.borderRadius = "10px";
          // Show inline error
          let err = document.getElementById("slotError");
          if (!err) {
            err = document.createElement("p");
            err.id = "slotError";
            err.style.cssText = "color:#e53e3e;font-size:13px;font-weight:600;margin:8px 0 0;";
            err.textContent = "Please select a time slot to continue.";
            slotGrid.parentElement.appendChild(err);
          }
          slotGrid.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        return;
      }
      // Clear any error
      const slotGrid = document.getElementById("slotGrid");
      if (slotGrid) {
        slotGrid.style.outline = "";
        const err = document.getElementById("slotError");
        if (err) err.remove();
      }
      buildSummary();
      showPane(3);
    });
    if (b3) b3.addEventListener("click", () => showPane(2));
    if (sub) sub.addEventListener("click", () => {
      // Validate name and phone are filled
      const nameInput = document.querySelector('#wizPane3 input[name="name"]');
      const phoneInput = document.querySelector('#wizPane3 input[name="phone"]');
      let valid = true;

      [{input: nameInput, errId: "wizNameErr", msg: "Please enter your full name."},
       {input: phoneInput, errId: "wizPhoneErr", msg: "Please enter your phone number."}
      ].forEach(({input, errId, msg}) => {
        if (!input) return;
        let err = document.getElementById(errId);
        if (!input.value.trim()) {
          valid = false;
          input.style.borderColor = "#e53e3e";
          input.style.boxShadow = "0 0 0 3px rgba(229,62,62,.15)";
          if (!err) {
            err = document.createElement("p");
            err.id = errId;
            err.style.cssText = "color:#e53e3e;font-size:13px;font-weight:600;margin:4px 0 0;";
            err.textContent = msg;
            input.parentElement.after(err);
          }
        } else {
          input.style.borderColor = "";
          input.style.boxShadow = "";
          if (err) err.remove();
        }
      });

      if (!valid) {
        (nameInput && !nameInput.value.trim() ? nameInput : phoneInput).scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      showPane(4);
    });
  }

  applyTheme();
  app.innerHTML =
    page === "booking" ? bookingPage() :
    page === "doctor"  ? doctorPage(pageId) :
    page === "blog"    ? blogListPage() :
    page === "post"    ? blogPostPage(pageId) :
    homePage();
  if (page === "booking") document.body.classList.add("page-booking");
  bindUi();

})();

    </script>
