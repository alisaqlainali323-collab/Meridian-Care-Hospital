    .chat-fab:hover .chat-fab-label{ opacity:1;visibility:visible;transform:translateY(-50%) translateX(0); }
    @media(max-width:640px){ .chat-fab-label{ display:none; } }

    /* ── CHAT WIDGET ───────────────────────────────────────── */
    .chat-widget{
      position:fixed;bottom:90px;right:22px;z-index:1000;
      width:370px;max-height:600px;
      display:flex;flex-direction:column;
      border-radius:20px;background:#fff;
      box-shadow:0 20px 60px rgba(6,40,35,.18),0 4px 16px rgba(6,40,35,.1);
      border:1px solid var(--line);overflow:hidden;
      opacity:0;visibility:hidden;pointer-events:none;
      transform:translateY(16px) scale(.97);
      transition:opacity .22s ease,visibility .22s ease,transform .22s ease;
    }
    .chat-widget.is-open{
      opacity:1;visibility:visible;pointer-events:all;transform:translateY(0) scale(1);
    }
    @media(max-width:420px){
      .chat-widget{ right:10px;left:10px;width:auto;bottom:88px; }
    }

    /* Header */
    .chat-header{
      display:flex;align-items:center;gap:10px;
      padding:14px 16px;background:var(--primary);color:#fff;flex-shrink:0;
    }
    .chat-header-avatar{
      display:grid;place-items:center;width:38px;height:38px;
      border-radius:999px;background:rgba(255,255,255,.18);flex-shrink:0;
    }
    .chat-header-avatar svg{ width:20px;height:20px;stroke:#fff; }
    .chat-header-info{ flex:1;min-width:0; }
    .chat-header-info strong{ display:block;font-size:14px;font-weight:700; }
    .chat-header-info span{ font-size:11.5px;opacity:.8; }
    .chat-header-status{
      display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.85;white-space:nowrap;
    }
    .chat-header-status span{
      width:7px;height:7px;border-radius:999px;background:#4ade80;display:inline-block;
      box-shadow:0 0 0 2px rgba(74,222,128,.3);
    }
    .chat-close-btn{
      display:grid;place-items:center;width:30px;height:30px;
      border:none;background:rgba(255,255,255,.15);border-radius:999px;
      color:#fff;cursor:pointer;transition:background .15s;flex-shrink:0;
    }
    .chat-close-btn:hover{ background:rgba(255,255,255,.28); }
    .chat-close-btn svg{ width:14px;height:14px; }

    /* Disclaimer banner */
    .chat-mode-banner{
      padding:8px 14px;background:rgba(47,125,63,.07);
      border-bottom:1px solid rgba(47,125,63,.12);
      font-size:12px;font-weight:600;color:var(--primary);
      flex-shrink:0;line-height:1.4;
    }

    /* Messages */
    .chat-messages{
      flex:1;overflow-y:auto;padding:16px;
      display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
    }
    .chat-messages::-webkit-scrollbar{ width:4px; }
    .chat-messages::-webkit-scrollbar-thumb{ background:var(--line);border-radius:4px; }
    .chat-msg{
      display:flex;gap:8px;align-items:flex-end;
      animation:msgIn .2s ease both;
    }
    @keyframes msgIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .chat-msg--bot{ justify-content:flex-start; }
    .chat-msg--user{ justify-content:flex-end; }
    .chat-bubble{
      max-width:84%;padding:10px 14px;border-radius:16px;
      font-size:13.5px;line-height:1.55;word-break:break-word;
    }
    .chat-msg--bot .chat-bubble{
      background:var(--surface);color:var(--ink);
      border-bottom-left-radius:4px;border:1px solid var(--line);
    }
    .chat-msg--user .chat-bubble{
      background:var(--primary);color:#fff;border-bottom-right-radius:4px;
    }
    .chat-bubble p{ margin:0;color:inherit;font-size:inherit;line-height:inherit; }
    .chat-bubble p+p{ margin-top:6px; }
    .chat-bubble ul{ margin:6px 0 0;padding-left:18px;font-size:inherit;line-height:inherit; }
    .chat-bubble li{ margin-bottom:3px;font-size:inherit; }
    .chat-bubble strong,.chat-bubble em{ font-size:inherit; }
    .chat-bot-icon{
      display:grid;place-items:center;
      width:28px;height:28px;flex-shrink:0;
      border-radius:999px;background:var(--primary);margin-bottom:2px;
    }
    .chat-bot-icon svg{ width:14px;height:14px;stroke:#fff; }

    /* Typing indicator */
    .chat-typing .chat-bubble{ display:flex;align-items:center;gap:4px;padding:12px 16px; }
    .chat-typing .dot{
      width:6px;height:6px;border-radius:999px;background:var(--muted);
      animation:typingDot 1.2s infinite;
    }
    .chat-typing .dot:nth-child(2){ animation-delay:.2s; }
    .chat-typing .dot:nth-child(3){ animation-delay:.4s; }
    @keyframes typingDot{
      0%,60%,100%{ transform:translateY(0);opacity:.5; }
      30%{ transform:translateY(-5px);opacity:1; }
    }

    /* Input row */
    .chat-input-row{
      display:flex;align-items:center;gap:8px;
      padding:12px 14px;border-top:1px solid var(--line);
      flex-shrink:0;background:#fff;
    }
    #chatInput{
      flex:1;border:1px solid var(--line);border-radius:999px;
      padding:9px 16px;font-size:13.5px;color:var(--ink);
      background:#f8fbfa;outline:none;width:auto;min-width:0;
      transition:border-color .15s,box-shadow .15s;
    }
    #chatInput:focus{ border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,125,63,.1); }
    .chat-send-btn{
      display:grid;place-items:center;
      width:38px;height:38px;flex-shrink:0;
      border:none;border-radius:999px;
      background:var(--primary);color:#fff;cursor:pointer;
      transition:background .15s,transform .15s;
    }
    .chat-send-btn:hover{ background:var(--primaryDark);transform:scale(1.06); }
    .chat-send-btn svg{ width:16px;height:16px; }
    </style>

    <script>
    (function(){
      /* ═══════════════════════════════════════════════════════
         KNOWLEDGE BASE (for General mode fallback & context)
      ═══════════════════════════════════════════════════════ */
      const ASSISTANT_CONTEXT = `
You are the Patient Assistant AI for Meridian Care Hospital, Islamabad, Pakistan — a multi-doctor clinic. In the same conversation you handle both (1) practical clinic questions and (2) symptom triage that creates appropriate urgency and guides the patient toward booking. These are not separate modes — answer whichever the patient raises, and weave the other in naturally (e.g. after triaging a symptom, name the right doctor's hours and fee; if asked a clinic question, you can also ask about their health concern).

OUR DOCTORS:
1. Dr. Bilal Chaudhry — MBBS, FCPS (Internal Medicine), Assistant Professor, 7+ years, PMDC verified. Specialties: Diabetes Management, Weight Loss, Hypertension & BP, Internal Medicine, Thyroid Disorders. Hours: Mon–Sat, 5:00 PM – 10:00 PM. Fee: Rs. 2,000.
2. Dr. Sana Farooq — MBBS, FCPS (Dermatology), Consultant Dermatologist, 5+ years. Specialties: Acne & Skin Care, Hair Loss Treatment, Skin Allergies, Cosmetic Dermatology. Hours: Mon–Sat, 5:00 PM – 10:00 PM. Fee: Rs. 2,500.
3. Dr. Omar Siddiqui — MBBS, General Physician, 18+ years. Specialties: General Checkups, Digestive Disorders, Preventive Healthcare, Hypertension Management, Cholesterol Management. Hours: Mon–Fri, 3:00 PM – 9:00 PM. Fee: Rs. 3,000.

CLINIC FACTS:
- Clinic: Meridian Care Hospital, F-8 Markaz, Islamabad
- Payment: Cash only. No credit/debit cards, no JazzCash/Easypaisa. No insurance panels.
- Phone: +92 51 234 5678
- Appointment: Book online on the website or walk in (booking recommended)
- Cancel/Reschedule: Call +92 51 234 5678
- Prescription Refills: Require a consultation visit
- Lab Tests: Prescribed by our doctors, performed at nearby labs (no in-house lab)
- Pharmacy: No in-house pharmacy. Nearby pharmacies in F-8 Markaz.
- Emergency: Call 1122 (Rescue) or nearest hospital. Telehealth consultation available via +92 51 234 5678.
- Brings to Appointment: Old prescriptions, lab reports, medical records

SYMPTOM TRIAGE — when a patient describes a symptom or health concern:
- Ask clarifying questions ONE at a time to build a complete picture: main symptom → duration → severity (1-10) → associated symptoms → relevant history (existing conditions, medications)
- Once you have enough information, give a structured summary using this format:
  **Possible Areas of Concern:** (2-4 general possibilities, never a diagnosis)
  **Urgency Level:** Low / Moderate / Seek care soon / Emergency
  **Recommended Doctor:** name the correct doctor above based on the symptoms, including their hours and fee
  **Next Step:** book an appointment or seek emergency care
- NEVER diagnose. Only describe possible general causes for patient awareness.
- EMERGENCY SIGNS — if the patient reports chest pain, signs of stroke (facial drooping, slurred speech, weakness on one side), severe difficulty breathing, uncontrolled bleeding, or loss of consciousness: immediately tell them to call 1122 or go to the nearest ER. Do not continue routine questioning in this case.
- Be empathetic, calm, and clear — avoid alarming language for non-urgent symptoms, but be direct about urgency when it's warranted so the patient understands booking soon matters.

GENERAL BEHAVIOR:
- If a patient's concern is skin/hair-related, the right doctor is Dr. Sana Farooq. If it's diabetes/weight/hypertension/general internal medicine, it's Dr. Bilal Chaudhry. If it's a general checkup, digestive issue, or doesn't clearly fit another specialty, it's Dr. Omar Siddiqui (General Physician). If unclear, ask what the concern is before recommending a doctor.
- Be warm, professional, and helpful — like a clinic receptionist with medical knowledge
- For clinic/appointment questions, use the facts above precisely and name the correct doctor
- Always recommend booking an appointment with the relevant doctor for personal medical concerns
- Respond in the same language the patient writes in (English or Urdu)
- Keep responses concise and easy to read on a phone screen. Use bullet points when listing multiple items.
- IMPORTANT: You are an AI assistant, not a doctor. Always clarify this for medical advice, and never provide a diagnosis or prescribe treatment.
`.trim();

      const GREETING = `Hello! 👋 I'm the <strong>Patient Assistant</strong> for Meridian Care Hospital. Tell me what's going on and I'll help you figure out next steps — or ask me anything about our doctors, hours, or fees.<br><br><em>Note: This is not a medical diagnosis. Always consult one of our specialists for proper evaluation.</em>`;

      const MODES = {
        assistant: { label: "Patient Assistant", sub: "Meridian Care Hospital", system: ASSISTANT_CONTEXT, placeholder: "Describe your symptoms or ask a question…" },
      };

      /* ═══════════════════════════════════════════════════
         STATE
      ═══════════════════════════════════════════════════ */
      let currentMode = "assistant";
      let conversationHistory = {};  // per-mode history
      Object.keys(MODES).forEach(m => conversationHistory[m] = []);

      let isOpen = false;
      let greeted = {};
      Object.keys(MODES).forEach(m => greeted[m] = false);

      /* ═══════════════════════════════════════════════════
         DOM REFS
      ═══════════════════════════════════════════════════ */
      const fab         = document.getElementById("chatFab");
      const widget      = document.getElementById("chatWidget");
      const msgs        = document.getElementById("chatMessages");
      const input       = document.getElementById("chatInput");
      const sendBtn     = document.getElementById("chatSendBtn");
      const closeBtn    = document.getElementById("chatCloseBtn");
      const openIcon    = fab.querySelector(".chat-fab-icon--open");
      const closeIcon2  = fab.querySelector(".chat-fab-icon--close");

      /* ═══════════════════════════════════════════════════
         API KEY MANAGEMENT
         (No longer needed client-side — the Cloudflare Worker
         proxy holds the Groq key server-side. This always
         returns true so the chatbot works immediately.)
      ═══════════════════════════════════════════════════ */
      function checkApiKey(){
        return true;
      }

      /* ═══════════════════════════════════════════════════
         HELPERS
      ═══════════════════════════════════════════════════ */
      function escHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

      function botIconSvg(){
        return `<div class="chat-bot-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div>`;
      }

      function addBotMsg(html){
        const div = document.createElement("div");
        div.className = "chat-msg chat-msg--bot";
        div.innerHTML = `${botIconSvg()}<div class="chat-bubble">${html}</div>`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }

      function addUserMsg(text){
        const div = document.createElement("div");
        div.className = "chat-msg chat-msg--user";
        div.innerHTML = `<div class="chat-bubble">${escHtml(text)}</div>`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }

      function showTyping(){
        const div = document.createElement("div");
        div.className = "chat-msg chat-msg--bot chat-typing";
        div.id = "chatTyping";
        div.innerHTML = `${botIconSvg()}<div class="chat-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
        return div;
      }

      function removeTyping(){ const t = document.getElementById("chatTyping"); if(t) t.remove(); }

      function formatResponse(text){
        // Convert markdown-like syntax to HTML for display
        let h = text
          .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
          .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
          .replace(/\*(.+?)\*/g,"<em>$1</em>")
          .replace(/^#{1,3}\s+(.+)$/gm,"<strong>$1</strong>")
          .replace(/^[-•]\s+(.+)$/gm,"<li>$1</li>")
          .replace(/(<li>[\s\S]*?<\/li>)/g, m => `<ul>${m}</ul>`)
          // fix nested ul wrapping issue
          .replace(/<\/ul>\s*<ul>/g,"")
          .replace(/\n{2,}/g,"</p><p>")
          .replace(/\n/g,"<br>");
        if(!h.startsWith("<")) h = "<p>" + h;
        if(!h.endsWith(">")) h += "</p>";
        return h;
      }

      /* ═══════════════════════════════════════════════════
         GROK API CALL (via Cloudflare Worker proxy —
         the Groq key lives server-side in the Worker, never
         exposed in this file or the visitor's browser)
      ═══════════════════════════════════════════════════ */
      const WORKER_URL = "https://dr-ahmed-raza.vercel.app/api/chat";

      async function callGrokAPI(userText){
        const mode = currentMode;
        const systemPrompt = MODES[mode].system;

        // Add to history
        conversationHistory[mode].push({ role: "user", content: userText });

        // Keep history manageable (last 10 exchanges = 20 messages)
        if(conversationHistory[mode].length > 20){
          conversationHistory[mode] = conversationHistory[mode].slice(-20);
        }

        // xAI uses OpenAI-compatible /v1/chat/completions format
        // System prompt goes as first message with role "system"
        const messages = [
          { role: "system", content: systemPrompt },
          ...conversationHistory[mode]
        ];

        const payload = {
          model: "openai/gpt-oss-120b",
          max_tokens: 800,
          messages: messages
        };

        const resp = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if(!resp.ok){
          const errBody = await resp.json().catch(()=>({}));
          console.error("Grok API error:", resp.status, JSON.stringify(errBody));
          const msg = errBody.error?.message || errBody.message || JSON.stringify(errBody) || `HTTP ${resp.status}`;
          throw new Error(`${resp.status}: ${msg}`);
        }

        const data = await resp.json();
        const assistantText = data.choices?.[0]?.message?.content || "Sorry, I couldn't get a response. Please try again.";

        // Save assistant reply to history
        conversationHistory[mode].push({ role: "assistant", content: assistantText });

        return assistantText;
      }

      /* ═══════════════════════════════════════════════════
         SEND MESSAGE
      ═══════════════════════════════════════════════════ */
      async function send(){
        const text = input.value.trim();

        if(!text) return;
        if(!checkApiKey()) return;

        // Show user message
        addUserMsg(text);
        input.value = "";

        // Typing indicator
        showTyping();

        try {
          const reply = await callGrokAPI(text);
          removeTyping();
          addBotMsg(formatResponse(reply));
        } catch(e){
          removeTyping();
          addBotMsg(`<span style="color:#e53e3e">⚠️ Error: ${escHtml(e.message)}.<br>Please try again.</span>`);
        }
      }

      sendBtn.addEventListener("click", send);
      input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });

      /* ═══════════════════════════════════════════════════
         (removed) IMAGE HANDLING — no longer used
      ═══════════════════════════════════════════════════ */
      /* ═══════════════════════════════════════════════════
         OPEN / CLOSE
      ═══════════════════════════════════════════════════ */
      function openChat(){
        isOpen = true;
        widget.classList.add("is-open");
        widget.setAttribute("aria-hidden","false");
        openIcon.style.display = "none";
        closeIcon2.style.display = "flex";

        // Check API key and greet if first time
        const hasKey = checkApiKey();
        if(hasKey && !greeted[currentMode]){
          greeted[currentMode] = true;
          setTimeout(()=>{
            addBotMsg(GREETING);
            conversationHistory[currentMode].push({ role:"assistant", content: GREETING });
          }, 180);
        }

        setTimeout(()=>input.focus(), 250);
      }

      function closeChat(){
        isOpen = false;
        widget.classList.remove("is-open");
        widget.setAttribute("aria-hidden","true");
        openIcon.style.display = "flex";
        closeIcon2.style.display = "none";
      }

      fab.addEventListener("click", ()=> isOpen ? closeChat() : openChat());
      fab.addEventListener("keydown", e=>{
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); isOpen ? closeChat() : openChat(); }
      });
      closeBtn.addEventListener("click", closeChat);

      /* ═══════════════════════════════════════════════════
         FAB VISIBILITY — appears once the hero section has
         scrolled out of view, so it never sits on top of the
         hero CTAs.
      ═══════════════════════════════════════════════════ */
      const heroEl = document.querySelector(".hero-v2, .hero");
      if (heroEl && "IntersectionObserver" in window) {
        const heroObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            fab.classList.toggle("is-visible", !entry.isIntersecting);
          });
        }, { threshold: 0, rootMargin: "-10% 0px 0px 0px" });
        heroObserver.observe(heroEl);
      } else {
        setTimeout(()=> fab.classList.add("is-visible"), 200);
      }

    })();
    </script>
    <!-- ── END AI PATIENT ASSISTANT ─────────────────────────── -->

  </body>
